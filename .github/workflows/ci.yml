name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: check (lint/invariants/tsc/build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, matching weekly-verify.yml: `npm run test:node` imports .ts files
          # directly, which needs native type-stripping (Node 23+). On 20 it dies
          # with ERR_UNKNOWN_FILE_EXTENSION. pdfjs-dist also wants >=22.13 || >=24.
          node-version: 24
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci
      - run: npm run check
